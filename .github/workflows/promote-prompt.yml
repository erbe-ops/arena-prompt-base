name: Promouvoir prompt depuis projets erbe-ops (W1 central)

on:
  schedule:
    - cron: '0 * * * *' # horaire
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repo source spécifique (ex: erbe-ops/01-template-projet) - vide = scan tous'
        required: false
        type: string
      dry_run:
        description: 'Dry run (ne crée pas de PR)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-prompt
  cancel-in-progress: false

env:
  CENTRAL_FILE: 00.prompt.base.Github.md
  TARGET_BRANCH: main

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lire version centrale
        id: central
        run: |
          file="${{ env.CENTRAL_FILE }}"
          test -f "$file"
          ver=$(grep -E '^# Version' "$file" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          sha=$(sha256sum "$file" | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Central $ver $sha"

      - name: Préparer token lecture projets privés
        id: token
        env:
          HAS_PAT: ${{ secrets.PAT_RO != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "Utilise PAT_RO secret pour lire dépôts privés"
            echo "pat_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "PAT_RO absent - GITHUB_TOKEN ne peut pas lire les dépôts privés erbe-ops"
            echo "Si tes projets sont privés, crée un PAT_RO (voir README)"
            echo "pat_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo source spécifique (si fourni)
        if: inputs.source_repo != ''
        id: checkout_source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: main
          path: /tmp/source_repo
          token: ${{ secrets.PAT_RO || github.token }}

      - name: Scanner candidates
        id: scan
        env:
          GH_TOKEN: ${{ secrets.PAT_RO || github.token }}
          INPUT_REPO: ${{ inputs.source_repo }}
          PAT_EXISTS: ${{ steps.token.outputs.pat_exists }}
        run: |
          central_ver="${{ steps.central.outputs.version }}"
          central_sha="${{ steps.central.outputs.sha256 }}"
          echo "[]" > /tmp/candidates.json
          mkdir -p /tmp/candidates_files

          # Mode 1 : repo spécifique fourni -> lecture directe depuis checkout
          if [ -n "$INPUT_REPO" ]; then
            echo "=== Mode repo spécifique : $INPUT_REPO ==="
            src_path="/tmp/source_repo/${{ env.CENTRAL_FILE }}"
            if [ ! -f "$src_path" ]; then
              echo "Fichier $src_path introuvable après checkout"
              echo "Vérifie que le repo existe, est accessible avec le token, et contient ${{ env.CENTRAL_FILE }} sur main"
              ls -la /tmp/source_repo/ || true
              exit 1
            fi
            cand_ver=$(grep -E '^# Version' "$src_path" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
            cand_sha=$(sha256sum "$src_path" | awk '{print $1}')
            # commit sha du fichier
            src_commit=$(git -C /tmp/source_repo log -1 --format=%H -- "${{ env.CENTRAL_FILE }}" 2>/dev/null || echo "unknown")
            echo "  candidate $cand_ver $cand_sha from $src_commit"

            if printf "%s\n%s\n" "$central_ver" "$cand_ver" | sort -V | tail -1 | grep -qx "$cand_ver" && [ "$cand_ver" != "$central_ver" ]; then
              echo "  -> newer than central"
              jq --arg repo "$INPUT_REPO" --arg ver "$cand_ver" --arg sha "$cand_sha" --arg commit "$src_commit" --arg base_ver "$central_ver" --arg base_sha "$central_sha" \
                '. + [{"source_repo": $repo, "source_commit": $commit, "base_version": $base_ver, "base_sha256": $base_sha, "candidate_version": $ver, "candidate_sha256": $sha}]' \
                /tmp/candidates.json > /tmp/tmp.json && mv /tmp/tmp.json /tmp/candidates.json
              cp "$src_path" "/tmp/candidates_files/$(echo $INPUT_REPO | tr / _).md"
            else
              echo "  -> not newer (central $central_ver, candidate $cand_ver)"
            fi
          else
            # Mode 2 : scan tous les repos erbe-ops
            echo "=== Mode scan tous les repos erbe-ops ==="
            if [ "$PAT_EXISTS" != "true" ]; then
              echo "ATTENTION: PAT_RO absent, le scan des dépôts privés va échouer"
              echo "Crée un secret PAT_RO avec scope repo:read (voir README)"
            fi
            gh repo list erbe-ops --limit 100 --json nameWithOwner --jq '.[].nameWithOwner' > /tmp/repos.txt
            cat /tmp/repos.txt

            while read -r repo; do
              [ -z "$repo" ] && continue
              [ "$repo" = "erbe-ops/arena-prompt-base" ] && continue
              echo "=== Scan $repo ==="
              # Essai 1 : raw.githubusercontent avec token PAT (plus fiable que base64 API)
              # Utilise curl avec auth si PAT présent
              if [ "$PAT_EXISTS" = "true" ]; then
                curl -sL -H "Authorization: token ${{ secrets.PAT_RO }}" "https://raw.githubusercontent.com/$repo/main/${{ env.CENTRAL_FILE }}" -o /tmp/candidate.md || true
              else
                curl -sL "https://raw.githubusercontent.com/$repo/main/${{ env.CENTRAL_FILE }}" -o /tmp/candidate.md || true
              fi

              # Fallback : gh api contents si curl échoue (pour compat)
              if [ ! -s /tmp/candidate.md ] || ! grep -q "Version" /tmp/candidate.md; then
                echo "  curl a échoué ou fichier vide, essai gh api"
                b64=$(gh api repos/$repo/contents/${{ env.CENTRAL_FILE }} --jq '.content' 2>/dev/null || echo "")
                if [ -n "$b64" ]; then
                  # nettoyage base64 : supprime retours ligne, ignore garbage
                  echo "$b64" | tr -d '\n\r ' | base64 -d -i > /tmp/candidate.md 2>/dev/null || echo "" > /tmp/candidate.md
                fi
              fi

              if [ ! -s /tmp/candidate.md ] || ! grep -q "Version" /tmp/candidate.md; then
                echo "  no file or not accessible"
                continue
              fi

              cand_ver=$(grep -E '^# Version' /tmp/candidate.md | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
              cand_sha=$(sha256sum /tmp/candidate.md | awk '{print $1}')
              src_commit=$(gh api repos/$repo/commits?path=${{ env.CENTRAL_FILE }}&sha=main --jq '.[0].sha' 2>/dev/null || echo "unknown")
              echo "  candidate $cand_ver $cand_sha from $src_commit"

              if printf "%s\n%s\n" "$central_ver" "$cand_ver" | sort -V | tail -1 | grep -qx "$cand_ver" && [ "$cand_ver" != "$central_ver" ]; then
                echo "  -> newer"
                jq --arg repo "$repo" --arg ver "$cand_ver" --arg sha "$cand_sha" --arg commit "$src_commit" --arg base_ver "$central_ver" --arg base_sha "$central_sha" \
                  '. + [{"source_repo": $repo, "source_commit": $commit, "base_version": $base_ver, "base_sha256": $base_sha, "candidate_version": $ver, "candidate_sha256": $sha}]' \
                  /tmp/candidates.json > /tmp/tmp.json && mv /tmp/tmp.json /tmp/candidates.json
                cp /tmp/candidate.md "/tmp/candidates_files/$(echo $repo | tr / _).md"
              else
                echo "  -> not newer"
              fi
            done < /tmp/repos.txt
          fi

          cat /tmp/candidates.json
          echo "count=$(jq length /tmp/candidates.json)" >> "$GITHUB_OUTPUT"
          conflicts=$(jq -r 'group_by(.candidate_version) | map(select(length>1 and (map(.candidate_sha256) | unique | length>1))) | length' /tmp/candidates.json)
          echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"

      - name: Choisir meilleure candidate
        if: steps.scan.outputs.count != '0'
        id: choose
        run: |
          best=$(jq -r 'sort_by(.candidate_version | split(".") | map(tonumber)) | last' /tmp/candidates.json)
          echo "$best" | jq .
          echo "$best" > /tmp/best.json
          echo "repo=$(echo $best | jq -r .source_repo)" >> "$GITHUB_OUTPUT"
          echo "version=$(echo $best | jq -r .candidate_version)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo $best | jq -r .candidate_sha256)" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo $best | jq -r .source_commit)" >> "$GITHUB_OUTPUT"
          echo "base_version=$(echo $best | jq -r .base_version)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(echo $best | jq -r .base_sha256)" >> "$GITHUB_OUTPUT"

      - name: Vérifier C2
        if: steps.scan.outputs.count != '0'
        id: c2
        run: |
          central_sha_now=$(sha256sum ${{ env.CENTRAL_FILE }} | awk '{print $1}')
          central_ver_now=$(grep -E '^# Version' ${{ env.CENTRAL_FILE }} | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "central now $central_ver_now $central_sha_now"
          echo "base expected ${{ steps.choose.outputs.base_version }} ${{ steps.choose.outputs.base_sha }}"
          if [ "$central_ver_now" != "${{ steps.choose.outputs.base_version }}" ]; then
            echo "C2 FAIL version centrale a changé"; exit 1
          fi
          if [ "$central_sha_now" != "${{ steps.choose.outputs.base_sha }}" ]; then
            echo "C2 FAIL hash central a changé"; exit 1
          fi
          if [ "${{ steps.scan.outputs.conflicts }}" != "0" ]; then
            echo "C2 CONFLICT même version contenus différents"
            jq . /tmp/candidates.json
            exit 1
          fi
          echo "C2 OK"

      - name: Créer branche de promotion
        if: steps.scan.outputs.count != '0' && inputs.dry_run == false
        env:
          REPO: ${{ steps.choose.outputs.repo }}
          VERSION: ${{ steps.choose.outputs.version }}
        run: |
          branch="promotion/$(echo $REPO | tr / -)-v$VERSION"
          echo "branch=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"
          src_file="/tmp/candidates_files/$(echo $REPO | tr / _).md"
          cp "$src_file" "${{ env.CENTRAL_FILE }}"
          git add "${{ env.CENTRAL_FILE }}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "prompt base: ${{ steps.choose.outputs.base_version }} -> $VERSION from $REPO@${{ steps.choose.outputs.commit }}

          source_repo: $REPO
          source_commit: ${{ steps.choose.outputs.commit }}
          base_version: ${{ steps.choose.outputs.base_version }}
          base_sha256: ${{ steps.choose.outputs.base_sha }}
          candidate_version: $VERSION
          candidate_sha256: ${{ steps.choose.outputs.sha }}"
          git push origin "$branch" --force-with-lease

      - name: Ouvrir PR
        if: steps.scan.outputs.count != '0' && inputs.dry_run == false
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.choose.outputs.repo }}
          VERSION: ${{ steps.choose.outputs.version }}
        run: |
          existing=$(gh pr list --base ${{ env.TARGET_BRANCH }} --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="Promotion automatique ${{ steps.choose.outputs.base_version }} -> $VERSION depuis $REPO

          Manifest C2:
          - source_repo: $REPO
          - source_commit: ${{ steps.choose.outputs.commit }}
          - base_version: ${{ steps.choose.outputs.base_version }}
          - base_sha256: ${{ steps.choose.outputs.base_sha }}
          - candidate_version: $VERSION
          - candidate_sha256: ${{ steps.choose.outputs.sha }}

          Vérifs: version > centrale OK, base inchangée OK, pas de conflit OK
          Source: https://github.com/$REPO/commit/${{ steps.choose.outputs.commit }}
          "
          gh pr create --base ${{ env.TARGET_BRANCH }} --head "$branch" --title "Promouvoir prompt v$VERSION depuis $REPO" --body "$body"
          pr=$(gh pr list --base ${{ env.TARGET_BRANCH }} --head "$branch" --state open --json number --jq '.[0].number')
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Auto-merge PR
        if: steps.scan.outputs.count != '0' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --auto --squash --delete-branch=false
